server.port=${SERVER_PORT:9090}
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
jwt.refresh-token-expiration-ms=${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}

razorpay.api.key=${RAZORPAY_API_KEY}
razorpay.api.secret=${RAZORPAY_API_SECRET}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET}

app.frontend.allowed-origins=${FRONTEND_ALLOWED_ORIGINS:https://kanhajiposhak.vercel.app}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Servlet Multipart Upload Limits
spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:10MB}

# Authoritative File Upload Security Configuration
file-upload.enabled=${FILE_UPLOAD_ENABLED:true}
file-upload.max-file-size-mb=${FILE_UPLOAD_MAX_SIZE_MB:5}
file-upload.max-image-width=${FILE_UPLOAD_MAX_WIDTH:3840}
file-upload.max-image-height=${FILE_UPLOAD_MAX_HEIGHT:3840}
file-upload.max-image-pixels=${FILE_UPLOAD_MAX_PIXELS:10000000}

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.email.verification-token-expiry-minutes=${EMAIL_VERIFICATION_TOKEN_EXPIRY_MINUTES:60}
app.email.reset-token-expiry-minutes=${EMAIL_RESET_TOKEN_EXPIRY_MINUTES:30}

# Payment Reconciliation & Recovery Configuration
payment.reconciliation.enabled=${PAYMENT_RECONCILIATION_ENABLED:true}
payment.reconciliation.cron=${PAYMENT_RECONCILIATION_CRON:0 */15 * * * *}
payment.reconciliation.threshold-minutes=${PAYMENT_RECONCILIATION_THRESHOLD_MINUTES:10}

payment.cleanup.enabled=${PAYMENT_CLEANUP_ENABLED:true}
payment.cleanup.cron=${PAYMENT_CLEANUP_CRON:0 */30 * * * *}
payment.cleanup.timeout-minutes=${PAYMENT_CLEANUP_TIMEOUT_MINUTES:30}

refund.retry.enabled=${REFUND_RETRY_ENABLED:true}
refund.retry.cron=${REFUND_RETRY_CRON:0 */15 * * * *}
refund.retry.max-attempts=${REFUND_RETRY_MAX_ATTEMPTS:5}
refund.retry.backoff-base-minutes=${REFUND_RETRY_BACKOFF_BASE_MINUTES:5}

# Rate Limiting Configuration
rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
rate-limit.trust-proxy-headers=${RATE_LIMIT_TRUST_PROXY_HEADERS:false}

rate-limit.auth.login-ip.capacity=${RATE_LIMIT_AUTH_LOGIN_IP_CAPACITY:5}
rate-limit.auth.login-ip.refill-tokens=${RATE_LIMIT_AUTH_LOGIN_IP_REFILL_TOKENS:5}
rate-limit.auth.login-ip.refill-duration-minutes=${RATE_LIMIT_AUTH_LOGIN_IP_REFILL_MINUTES:1}

rate-limit.auth.login-account.capacity=${RATE_LIMIT_AUTH_LOGIN_ACCT_CAPACITY:5}
rate-limit.auth.login-account.refill-tokens=${RATE_LIMIT_AUTH_LOGIN_ACCT_REFILL_TOKENS:5}
rate-limit.auth.login-account.refill-duration-minutes=${RATE_LIMIT_AUTH_LOGIN_ACCT_REFILL_MINUTES:1}

rate-limit.auth.register-ip.capacity=${RATE_LIMIT_AUTH_REGISTER_IP_CAPACITY:5}
rate-limit.auth.register-ip.refill-tokens=${RATE_LIMIT_AUTH_REGISTER_IP_REFILL_TOKENS:5}
rate-limit.auth.register-ip.refill-duration-minutes=${RATE_LIMIT_AUTH_REGISTER_IP_REFILL_MINUTES:10}

rate-limit.auth.register-account.capacity=${RATE_LIMIT_AUTH_REGISTER_ACCT_CAPACITY:5}
rate-limit.auth.register-account.refill-tokens=${RATE_LIMIT_AUTH_REGISTER_ACCT_REFILL_TOKENS:5}
rate-limit.auth.register-account.refill-duration-minutes=${RATE_LIMIT_AUTH_REGISTER_ACCT_REFILL_MINUTES:10}

rate-limit.auth.forgot-password-ip.capacity=${RATE_LIMIT_AUTH_FORGOT_IP_CAPACITY:3}
rate-limit.auth.forgot-password-ip.refill-tokens=${RATE_LIMIT_AUTH_FORGOT_IP_REFILL_TOKENS:3}
rate-limit.auth.forgot-password-ip.refill-duration-minutes=${RATE_LIMIT_AUTH_FORGOT_IP_REFILL_MINUTES:15}

rate-limit.auth.forgot-password-account.capacity=${RATE_LIMIT_AUTH_FORGOT_ACCT_CAPACITY:3}
rate-limit.auth.forgot-password-account.refill-tokens=${RATE_LIMIT_AUTH_FORGOT_ACCT_REFILL_TOKENS:3}
rate-limit.auth.forgot-password-account.refill-duration-minutes=${RATE_LIMIT_AUTH_FORGOT_ACCT_REFILL_MINUTES:15}

rate-limit.auth.reset-password-ip.capacity=${RATE_LIMIT_AUTH_RESET_IP_CAPACITY:5}
rate-limit.auth.reset-password-ip.refill-tokens=${RATE_LIMIT_AUTH_RESET_IP_REFILL_TOKENS:5}
rate-limit.auth.reset-password-ip.refill-duration-minutes=${RATE_LIMIT_AUTH_RESET_IP_REFILL_MINUTES:15}

rate-limit.auth.verify-email-ip.capacity=${RATE_LIMIT_AUTH_VERIFY_IP_CAPACITY:3}
rate-limit.auth.verify-email-ip.refill-tokens=${RATE_LIMIT_AUTH_VERIFY_IP_REFILL_TOKENS:3}
rate-limit.auth.verify-email-ip.refill-duration-minutes=${RATE_LIMIT_AUTH_VERIFY_IP_REFILL_MINUTES:10}

rate-limit.auth.resend-verification-ip.capacity=${RATE_LIMIT_AUTH_RESEND_IP_CAPACITY:3}
rate-limit.auth.resend-verification-ip.refill-tokens=${RATE_LIMIT_AUTH_RESEND_IP_REFILL_TOKENS:3}
rate-limit.auth.resend-verification-ip.refill-duration-minutes=${RATE_LIMIT_AUTH_RESEND_IP_REFILL_MINUTES:10}

rate-limit.auth.resend-verification-account.capacity=${RATE_LIMIT_AUTH_RESEND_ACCT_CAPACITY:3}
rate-limit.auth.resend-verification-account.refill-tokens=${RATE_LIMIT_AUTH_RESEND_ACCT_REFILL_TOKENS:3}
rate-limit.auth.resend-verification-account.refill-duration-minutes=${RATE_LIMIT_AUTH_RESEND_ACCT_REFILL_MINUTES:10}

rate-limit.auth.refresh-token-ip.capacity=${RATE_LIMIT_AUTH_REFRESH_IP_CAPACITY:10}
rate-limit.auth.refresh-token-ip.refill-tokens=${RATE_LIMIT_AUTH_REFRESH_IP_REFILL_TOKENS:10}
rate-limit.auth.refresh-token-ip.refill-duration-minutes=${RATE_LIMIT_AUTH_REFRESH_IP_REFILL_MINUTES:1}

rate-limit.auth.backoff.initial-delay-seconds=${RATE_LIMIT_AUTH_BACKOFF_INITIAL_DELAY:1}
rate-limit.auth.backoff.multiplier=${RATE_LIMIT_AUTH_BACKOFF_MULTIPLIER:2.0}
rate-limit.auth.backoff.max-delay-seconds=${RATE_LIMIT_AUTH_BACKOFF_MAX_DELAY:300}
rate-limit.auth.backoff.reset-after-seconds=${RATE_LIMIT_AUTH_BACKOFF_RESET_AFTER:900}
rate-limit.auth.backoff.failure-threshold=${RATE_LIMIT_AUTH_BACKOFF_FAILURE_THRESHOLD:1}

rate-limit.public-category.default-limit.capacity=${RATE_LIMIT_PUBLIC_CAPACITY:60}
rate-limit.public-category.default-limit.refill-tokens=${RATE_LIMIT_PUBLIC_REFILL_TOKENS:60}
rate-limit.public-category.default-limit.refill-duration-minutes=${RATE_LIMIT_PUBLIC_REFILL_MINUTES:1}

rate-limit.authenticated.default-limit.capacity=${RATE_LIMIT_AUTHED_CAPACITY:120}
rate-limit.authenticated.default-limit.refill-tokens=${RATE_LIMIT_AUTHED_REFILL_TOKENS:120}
rate-limit.authenticated.default-limit.refill-duration-minutes=${RATE_LIMIT_AUTHED_REFILL_MINUTES:1}

rate-limit.admin.default-limit.capacity=${RATE_LIMIT_ADMIN_CAPACITY:300}
rate-limit.admin.default-limit.refill-tokens=${RATE_LIMIT_ADMIN_REFILL_TOKENS:300}
rate-limit.admin.default-limit.refill-duration-minutes=${RATE_LIMIT_ADMIN_REFILL_MINUTES:1}

rate-limit.sensitive.contact.capacity=${RATE_LIMIT_SENSITIVE_CONTACT_CAPACITY:10}
rate-limit.sensitive.contact.refill-tokens=${RATE_LIMIT_SENSITIVE_CONTACT_REFILL_TOKENS:10}
rate-limit.sensitive.contact.refill-duration-minutes=${RATE_LIMIT_SENSITIVE_CONTACT_REFILL_MINUTES:10}

rate-limit.sensitive.order-creation.capacity=${RATE_LIMIT_SENSITIVE_ORDER_CAPACITY:10}
rate-limit.sensitive.order-creation.refill-tokens=${RATE_LIMIT_SENSITIVE_ORDER_REFILL_TOKENS:10}
rate-limit.sensitive.order-creation.refill-duration-minutes=${RATE_LIMIT_SENSITIVE_ORDER_REFILL_MINUTES:1}

rate-limit.sensitive.review-submission.capacity=${RATE_LIMIT_SENSITIVE_REVIEW_CAPACITY:10}
rate-limit.sensitive.review-submission.refill-tokens=${RATE_LIMIT_SENSITIVE_REVIEW_REFILL_TOKENS:10}
rate-limit.sensitive.review-submission.refill-duration-minutes=${RATE_LIMIT_SENSITIVE_REVIEW_REFILL_MINUTES:10}

rate-limit.sensitive.profile-mutation.capacity=${RATE_LIMIT_SENSITIVE_PROFILE_CAPACITY:30}
rate-limit.sensitive.profile-mutation.refill-tokens=${RATE_LIMIT_SENSITIVE_PROFILE_REFILL_TOKENS:30}
rate-limit.sensitive.profile-mutation.refill-duration-minutes=${RATE_LIMIT_SENSITIVE_PROFILE_REFILL_MINUTES:1}

rate-limit.sensitive.notification-mutation.capacity=${RATE_LIMIT_SENSITIVE_NOTIF_CAPACITY:60}
rate-limit.sensitive.notification-mutation.refill-tokens=${RATE_LIMIT_SENSITIVE_NOTIF_REFILL_TOKENS:60}
rate-limit.sensitive.notification-mutation.refill-duration-minutes=${RATE_LIMIT_SENSITIVE_NOTIF_REFILL_MINUTES:1}