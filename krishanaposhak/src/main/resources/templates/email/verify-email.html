<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Verify Your Email</title>
</head>
<body>
    <div style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px;">
        <h2 th:text="${'Hello, ' + user.firstName + '!'}">Hello, </h2>
        <p>Thank you for registering with Krishna Poshak. Please verify your email address to complete your registration.</p>
        <div style="text-align: center; margin: 30px 0;">
            <a th:href="${verificationUrl}" style="background-color: #2196F3; color: white; padding: 12px 24px; text-decoration: none; border-radius: 4px;">Verify Email</a>
        </div>
        <p>Or copy and paste the following link into your browser:</p>
        <p th:text="${verificationUrl}"></p>
        <p>This link will expire in 60 minutes.</p>
        <hr>
        <p style="font-size: 0.9em; color: #777;">This is an automated message, please do not reply.</p>
    </div>
</body>
</html>
