<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Order Confirmation</title>
</head>

<body>
    <div style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px;">
        <h2 th:text="'Hello, ' + (${customerName != null ? customerName : (user != null && user.firstName != null ? user.firstName : (order != null && order.customerName != null ? order.customerName : 'Customer'))}) + '!'">Hello, Customer!</h2>
        <p>Thank you for your order! Your order has been received and is being processed.</p>
        <h3>Order Details:</h3>
        <p><strong>Order Number:</strong> <span th:text="${orderNumber != null ? orderNumber : (order != null ? order.orderNumber : '')}"></span></p>
        <p><strong>Date:</strong> <span th:text="${order != null && order.createdAt != null ? #temporals.format(order.createdAt, 'dd/MM/yyyy HH:mm') : (orderDate != null ? #temporals.format(orderDate, 'dd/MM/yyyy HH:mm') : '')}"></span></p>
        <p><strong>Status:</strong> <span th:text="${order != null && order.orderStatus != null ? order.orderStatus : 'CONFIRMED'}"></span></p>
        <hr>
        <h4>Items:</h4>
        <table style="width: 100%; border-collapse: collapse;">
            <thead>
                <tr>
                    <th style="text-align: left; padding: 8px; border-bottom: 1px solid #ddd;">Product</th>
                    <th style="text-align: center; padding: 8px; border-bottom: 1px solid #ddd;">Quantity</th>
                    <th style="text-align: right; padding: 8px; border-bottom: 1px solid #ddd;">Price</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="item : ${orderItems != null ? orderItems : (order != null && order.orderItems != null ? order.orderItems : {})}">
                    <td style="text-align: left; padding: 8px; border-bottom: 1px solid #ddd;" th:text="${item.productName}">Product</td>
                    <td style="text-align: center; padding: 8px; border-bottom: 1px solid #ddd;" th:text="${item.quantity}">1</td>
                    <td style="text-align: right; padding: 8px; border-bottom: 1px solid #ddd;" th:text="'₹' + ${item.price}">₹0.00</td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="2" style="text-align: right; padding: 8px; border-top: 2px solid #333;">
                        <strong>Total:</strong></td>
                    <td style="text-align: right; padding: 8px; border-top: 2px solid #333;">
                        <strong th:text="'₹' + (${totalAmount != null ? totalAmount : (order != null ? order.totalAmount : '0.00')})">₹0.00</strong></td>
                </tr>
            </tfoot>
        </table>
        <br>
        <a th:href="${'https://kanhajiposhak.vercel.app/account/orders/' + (orderNumber != null ? orderNumber : (order != null ? order.orderNumber : ''))}"
            style="background-color: #2196F3; color: white; padding: 12px 24px; text-decoration: none; border-radius: 4px;">View Order</a>
        <hr>
        <p style="font-size: 0.9em; color: #777;">This is an automated message, please do not reply.</p>
    </div>
</body>

</html>
