<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="Kanhaji Poshak Kendra - Authentic Laddu Gopal Poshak & Devotional Accessories from Meerut." />
    <meta name="theme-color" content="#0F2440" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- DNS Prefetch & Preconnect for Critical Origins -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />
    <link rel="dns-prefetch" href="https://kanhaji-poshak-kendra.onrender.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link rel="preconnect" href="https://kanhaji-poshak-kendra.onrender.com" crossorigin />

    <!-- Preload Hero/LCP Image (First Banner) with fetchpriority high -->
    <link rel="preload" as="image" href="/ogImage.jpeg" fetchpriority="high" />

    <!-- Async Google Fonts Loading (Non-Render-Blocking) -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Cormorant+Garamond:wght@300;400;500;600&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Cormorant+Garamond:wght@300;400;500;600&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <!-- Inline Critical CSS for Above-the-Fold Content -->
    <style>
      html,body{margin:0;padding:0;width:100%;overflow-x:hidden;font-family:'Inter',system-ui,sans-serif;font-size:1rem;line-height:1.6;color:#2C2824;background-color:#FAF7F2;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
      #root{min-height:100vh}
      *,*::before,*::after{box-sizing:border-box}
      img{max-width:100%;height:auto;display:block}
      .hero-section{position:relative;overflow:hidden;background-color:#0F2440;min-height:65vh}
      @media(min-width:640px){.hero-section{min-height:75vh}}
      @media(min-width:1024px){.hero-section{min-height:85vh}}
      .hero-skeleton{position:absolute;inset:0;background:linear-gradient(90deg,#0F2440 25%,#162E4A 50%,#0F2440 75%);background-size:200% 100%;animation:shimmer 1.5s infinite}
      @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
    </style>

    <title>Kanhaji Poshak Kendra - Authentic Laddu Gopal Poshak & Temple Attire</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
